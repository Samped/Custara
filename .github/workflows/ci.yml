name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: custara
          POSTGRES_PASSWORD: custara
          POSTGRES_DB: custara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U custara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://custara:custara@localhost:5432/custara_test
      SESSION_SECRET: ci-session-secret-min-16
      ENCRYPTION_KEY: ci-encryption-key-min-16
      ALLOW_JIT_ORG_CREATION: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tenant isolation + policy tests
        run: npm test
