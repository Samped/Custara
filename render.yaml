# TESTNET ONLY — https://testnet.custara.xyz
# Do not point this database at custara.xyz or set ARC_CHAIN=ARC here.
# Mainnet is render.mainnet.yaml (new Postgres, new worker, new secrets).
# Free Render: worker is a web service (background workers are not free).
# Postgres on the free plan expires 30 days after creation.
services:
  - type: web
    name: custara-worker
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npx prisma generate
    startCommand: npx prisma db push --skip-generate && npm run worker
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://testnet.custara.xyz
      - key: NEXT_PUBLIC_APP_URL
        value: https://testnet.custara.xyz
      - key: PLATFORM_FEE_BPS
        value: "75"
      - key: PLATFORM_FEE_MIN_USDC
        value: "0.10"
      - key: PLATFORM_FEE_ADDRESS
        sync: false
      - key: REDIRECT_APEX_TO_TESTNET
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: custara-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: custara-redis
          property: connectionString
      - key: ARC_PAYMENTS_LIVE
        value: "true"
      - key: ARC_CHAIN
        value: ARC-TESTNET
      - key: ARC_ALLOW_LIVE_ON_TESTNET
        value: "true"
      - key: ARC_ALLOW_SIMULATED
        value: "false"
      - key: NIGERIA_PAYMENT_LIVE
        value: "false"
      - key: STORAGE_BACKEND
        value: s3
      - key: OPENAI_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ARC_USDC_TOKEN_ADDRESS
        sync: false
      - key: CIRCLE_API_KEY
        sync: false
      - key: CIRCLE_ENTITY_SECRET
        sync: false
      - key: CIRCLE_ENTITY_SECRET_CIPHERTEXT
        sync: false
      - key: CIRCLE_WEBHOOK_SECRET
        sync: false
      - key: CIRCLE_APP_ID
        sync: false
      - key: NEXT_PUBLIC_CIRCLE_APP_ID
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  - type: keyvalue
    name: custara-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: Vercel and the worker

databases:
  - name: custara-postgres
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: custara
    user: custara
    ipAllowList:
      - source: 0.0.0.0/0
        description: Vercel and the worker
